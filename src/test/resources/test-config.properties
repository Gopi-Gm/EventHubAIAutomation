# -----------------------------------------------------------------------
# test-config.properties
# Default configuration for the EventHub AI Automation Framework
#
# AI Settings (all AI features disabled by default)
# To enable AI analysis, set agr.ai.enabled=true AND provide
# the OPENAI_API_KEY environment variable.
# -----------------------------------------------------------------------

# ---- AI Layer Configuration ----

# Enable AI-powered failure analysis (requires OPENAI_API_KEY env var)
agr.ai.enabled=false

# If true, AI failures are ignored and tests still pass/fail normally.
# If false, AI exceptions will propagate and fail the run.
agr.ai.fail-open=true

# Maximum number of OpenAI API calls per test run (cost control)
agr.ai.budget.max-calls-per-run=20

# OpenAI model to use for analysis
agr.ai.model=gpt-4o-mini

# ---- Test Environment ----

# Base URL for the EventHub API (can be overridden via -Dbase.url=...)
base.url=https://api.eventhub.rahulshettyacademy.com

# ---- EventHub Credentials ----
eventhub.email=prem@yopmail.com
eventhub.password=Automation@2026
